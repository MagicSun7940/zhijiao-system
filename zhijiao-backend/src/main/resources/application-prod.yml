# =============================================
# 生产环境配置模板
# 部署时将占位符替换为真实值
# =============================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/zhijiao_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: your-mysql-password   # 部署时替换

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: your-redis-password  # 部署时替换
      database: 0
      timeout: 10s

# 阿里云 OSS
aliyun:
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    access-key-id: your-access-key-id         # 部署时替换
    access-key-secret: your-access-key-secret  # 部署时替换
    bucket-name: your-bucket-name              # 部署时替换
    url-prefix: https://your-bucket.oss-cn-hangzhou.aliyuncs.com/

logging:
  level:
    com.zhijiao: info   # 生产环境只记录info级别
