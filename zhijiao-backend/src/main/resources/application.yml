server:
  port: 8080

spring:
  application:
    name: zhijiao-backend
  profiles:
    active: dev        # 默认激活dev环境，切换只改这一行

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.zhijiao.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置（公共，两个环境共用）
jwt:
  secret: zhijiao2024SecretKeyForJWTTokenGenerationMustBe256Bits
  expire: 86400000
